name: Tool tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Check authored source and campaign views
        run: |
          python scripts/source_layout.py --check --inventory-check progress/source-inventory.json
          python scripts/campaign.py --runtime /tmp/rac2-campaign-ci views --check
      - name: Export verified RAC2 progress
        run: |
          python scripts/decomp_report.py --output build/decomp/report.json \
            $(for f in progress/levels/*.json; do printf -- '--level-proof %s ' "$f"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: SCUS_972.68_report
          path: build/decomp/report.json
          if-no-files-found: error
