name: Shared contributor reservations

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  reserve:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/reserve ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Apply authenticated reservation command
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/reservations.py handle-event --event "$GITHUB_EVENT_PATH"
