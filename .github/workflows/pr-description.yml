name: PR description contract

on:
  pull_request_target:
    branches: [RAC2]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to revalidate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Serialize rather than cancel: a cancelled older run must not publish a status
# over a newer description. Each run fetches current PR data before validation.
concurrency:
  group: pr-description-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  description:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/RAC2'
    name: Validate PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted target commit only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate body as data and publish exact-head status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/pr_description.py --event "$GITHUB_EVENT_PATH"
