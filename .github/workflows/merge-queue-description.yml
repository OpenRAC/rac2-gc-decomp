name: Merge queue description contract

on:
  merge_group:
    branches: [RAC2]
    types: [checks_requested]

# Queue workflows come from the synthetic contribution tree. They receive no
# status-writing token; Actions itself reports the required named job check.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-queue-description-${{ github.event.merge_group.head_sha }}
  cancel-in-progress: false

jobs:
  description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never run contributor Python with the API token. Load the current
      # protected implementation; PR bodies and webhook fields are only data.
      - name: Checkout current trusted target branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/RAC2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate current queued descriptions as data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/pr_description.py --event "$GITHUB_EVENT_PATH"
